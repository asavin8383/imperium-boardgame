<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Coin background - dark blue-grey -->
  <circle cx="50" cy="50" r="46" fill="#3a4050" stroke="#22262e" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="#454b5c" stroke="#2e3340" stroke-width="1"/>

  <clipPath id="coin-clip">
    <circle cx="50" cy="50" r="41"/>
  </clipPath>

  <g clip-path="url(#coin-clip)">
    <!-- Ground line -->
    <rect x="9" y="72" width="82" height="18" fill="#2e3340"/>

    <!-- Building 1 - tall center tower -->
    <rect x="42" y="32" width="16" height="40" fill="#c8c0b0" stroke="#a8a090" stroke-width="0.8"/>
    <!-- Windows center tower -->
    <rect x="45" y="36" width="4" height="4" fill="#3a4050"/>
    <rect x="51" y="36" width="4" height="4" fill="#3a4050"/>
    <rect x="45" y="43" width="4" height="4" fill="#3a4050"/>
    <rect x="51" y="43" width="4" height="4" fill="#3a4050"/>
    <rect x="45" y="50" width="4" height="4" fill="#ffd060" opacity="0.9"/>
    <rect x="51" y="50" width="4" height="4" fill="#3a4050"/>
    <rect x="45" y="57" width="4" height="4" fill="#3a4050"/>
    <rect x="51" y="57" width="4" height="4" fill="#ffd060" opacity="0.9"/>

    <!-- Building 2 - left mid -->
    <rect x="24" y="44" width="18" height="28" fill="#b8b4a8" stroke="#a8a090" stroke-width="0.8"/>
    <!-- Roof left mid -->
    <polygon points="24,44 33,34 42,44" fill="#d0ccc0" stroke="#a8a090" stroke-width="0.8"/>
    <!-- Windows left mid -->
    <rect x="27" y="48" width="4" height="4" fill="#3a4050"/>
    <rect x="35" y="48" width="4" height="4" fill="#ffd060" opacity="0.9"/>
    <rect x="27" y="56" width="4" height="4" fill="#ffd060" opacity="0.9"/>
    <rect x="35" y="56" width="4" height="4" fill="#3a4050"/>

    <!-- Building 3 - right mid -->
    <rect x="58" y="44" width="18" height="28" fill="#b8b4a8" stroke="#a8a090" stroke-width="0.8"/>
    <!-- Roof right mid -->
    <polygon points="58,44 67,34 76,44" fill="#d0ccc0" stroke="#a8a090" stroke-width="0.8"/>
    <!-- Windows right mid -->
    <rect x="61" y="48" width="4" height="4" fill="#ffd060" opacity="0.9"/>
    <rect x="69" y="48" width="4" height="4" fill="#3a4050"/>
    <rect x="61" y="56" width="4" height="4" fill="#3a4050"/>
    <rect x="69" y="56" width="4" height="4" fill="#ffd060" opacity="0.9"/>

    <!-- Building 4 - small left -->
    <rect x="12" y="54" width="14" height="18" fill="#a8a49a" stroke="#888880" stroke-width="0.8"/>
    <polygon points="12,54 19,46 26,54" fill="#bcb8b0" stroke="#888880" stroke-width="0.8"/>
    <rect x="15" y="58" width="4" height="4" fill="#3a4050"/>
    <rect x="22" y="58" width="4" height="4" fill="#ffd060" opacity="0.8"/>

    <!-- Building 5 - small right -->
    <rect x="74" y="54" width="14" height="18" fill="#a8a49a" stroke="#888880" stroke-width="0.8"/>
    <polygon points="74,54 81,46 88,54" fill="#bcb8b0" stroke="#888880" stroke-width="0.8"/>
    <rect x="77" y="58" width="4" height="4" fill="#ffd060" opacity="0.8"/>
    <rect x="84" y="58" width="4" height="4" fill="#3a4050"/>
  </g>
</svg>
